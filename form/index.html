<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>購入者フォーム | きくりんの教科書</title>
    <link rel="icon" href="../assets/favicon.png" type="image/png">
    <link rel="stylesheet" href="../style.css?v=1.1.0">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        .form-wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
        .form-card { background: #fff; border-radius: var(--border-radius, 12px); box-shadow: var(--card-shadow, 0 4px 12px rgba(0,0,0,.08)); padding: 24px 20px; }
        .form-card h1 { font-size: 1.35rem; margin: 0 0 8px; color: var(--primary-color, #f57c00); }
        .form-card p.lead { font-size: .95rem; line-height: 1.8; margin: 0 0 18px; color: #555; }
        .field { margin: 0 0 18px; }
        .field label.title { display: block; font-weight: 700; margin-bottom: 8px; }
        .field label.title .req { color: #e53935; font-size: .8rem; margin-left: 6px; }
        .choice { display: flex; flex-direction: column; gap: 8px; }
        .choice label { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1.5px solid #eee; border-radius: 10px; cursor: pointer; font-size: .98rem; }
        .choice label:has(input:checked) { border-color: var(--primary-color, #f57c00); background: #fff3e0; }
        .choice input { width: 20px; height: 20px; accent-color: var(--primary-color, #f57c00); }
        .field input[type=text], .field input[type=email], .field textarea { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 12px; border: 1.5px solid #ddd; border-radius: 10px; font-family: inherit; }
        .field textarea { min-height: 160px; resize: vertical; }
        .hint { font-size: .85rem; color: #777; margin-top: 6px; }
        .cf-turnstile { min-height: 65px; margin: 6px 0 12px; }
        .btn-send { width: 100%; padding: 14px; font-size: 1.05rem; font-weight: 700; color: #fff; background: var(--primary-color, #f57c00); border: 0; border-radius: 999px; cursor: pointer; }
        .btn-send:disabled { opacity: .6; cursor: default; }
        .msg { margin-top: 14px; padding: 12px; border-radius: 10px; display: none; line-height: 1.7; }
        .msg.ok { display: block; background: #e8f5e9; color: #1b5e20; }
        .msg.ng { display: block; background: #ffebee; color: #b71c1c; }
        .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
        .back { display: inline-block; margin-top: 18px; font-size: .9rem; }
    </style>
</head>
<body>
<div class="form-wrap">
    <div class="form-card">
        <h1>購入者フォーム</h1>
        <p class="lead">本書をお読みいただきありがとうございます。特典が開けない・ダウンロードできない、内容の質問、誤りの報告など、何かあればこちらからご連絡ください。ご質問への回答は、購入者全員に役立つようFAQとして還元します。個別コンサルへの勧誘はしません。</p>
        <form id="kf" novalidate>
            <div class="field">
                <label class="title">どの教材ですか<span class="req">必須</span></label>
                <div class="choice">
                    <label><input type="radio" name="product" value="ebay">AI × eBay輸出の教科書</label>
                    <label><input type="radio" name="product" value="rental">レンタルスペース経営の教科書</label>
                </div>
            </div>
            <div class="field">
                <label class="title">種類<span class="req">必須</span></label>
                <div class="choice">
                    <label><input type="radio" name="kind" value="tokuten">特典が開けない・ダウンロードできない</label>
                    <label><input type="radio" name="kind" value="question">内容についての質問</label>
                    <label><input type="radio" name="kind" value="bug">誤り・不具合の報告</label>
                    <label><input type="radio" name="kind" value="other">その他</label>
                </div>
            </div>
            <div class="field">
                <label class="title" for="email">メールアドレス(返信先)<span class="req">必須</span></label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label class="title" for="name">お名前(ニックネーム可)</label>
                <input type="text" id="name" name="name" autocomplete="nickname">
            </div>
            <div class="field">
                <label class="title" for="body">内容<span class="req">必須</span></label>
                <textarea id="body" name="body" required placeholder="できるだけ詳しくお書きください"></textarea>
                <div class="hint">特典の不具合は、お使いのPC(Windows/Mac)と、どこで止まったかも書いてもらえると早く直せます。</div>
            </div>
            <div class="hp" aria-hidden="true"><label>website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
            <input type="hidden" name="t" id="t">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEnhTATW140nE0jB" data-language="ja"></div>
            <button type="submit" class="btn-send" id="send">送信する</button>
            <div class="msg" id="msg"></div>
        </form>
        <a class="back" href="../index.html">← ブログに戻る</a>
    </div>
</div>
<script>
(function () {
    var ENDPOINT = 'https://kikurin-form.kikurin.workers.dev/submit';
    var p = new URLSearchParams(location.search).get('p');
    if (p === 'ebay' || p === 'rental') { var r = document.querySelector('input[name=product][value=' + p + ']'); if (r) r.checked = true; }
    document.getElementById('t').value = String(Date.now());
    var form = document.getElementById('kf'), btn = document.getElementById('send'), msg = document.getElementById('msg');
    function show(cls, text) { msg.className = 'msg ' + cls; msg.textContent = text; }
    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var d = new FormData(form);
        if (!d.get('product')) return show('ng', '教材を選んでください');
        if (!d.get('kind')) return show('ng', '種類を選んでください');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.get('email') || '')) return show('ng', 'メールアドレスの形式を確認してください');
        if ((d.get('body') || '').trim().length < 5) return show('ng', '内容を入力してください');
        btn.disabled = true; show('', '');
        try {
            var res = await fetch(ENDPOINT, { method: 'POST', body: d });
            var j = await res.json().catch(function () { return {}; });
            if (res.ok && j.ok) { form.reset(); show('ok', '受け付けました。2営業日以内に、ご記入のメールアドレスへ返信します。'); }
            else { show('ng', j.error || '送信に失敗しました。時間をおいてもう一度お試しください'); btn.disabled = false; }
        } catch (err) { show('ng', '通信エラーです。時間をおいてもう一度お試しください'); btn.disabled = false; }
        if (window.turnstile) try { window.turnstile.reset(); } catch (e2) {}
        document.getElementById('t').value = String(Date.now());
    });
})();
</script>
</body>
</html>
